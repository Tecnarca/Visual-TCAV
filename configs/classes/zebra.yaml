classes:
  - name: zebra
    example_image: zebra.jpg
    concepts_groups:
      - true_label: striped
        generated:
          - striped_flux
          - striped_sd35
          - striped_cgpt
          - striped_cgpt_with_zebra_parts
          - random
        concept_imputation:
          example: unstriped_zebra.png
          folder: zebra_unstriped
      - true_label: dotted
        generated:
          - dotted_flux_2
          - dotted_sd35_2
          - dotted_cgpt_2
          - random
        concept_imputation:
          example: unstriped_zebra.png
          folder: zebra_unstriped
      - true_label: zigzagged
        generated:
          - zigzagged_flux
          - zigzagged_cgpt
          - zigzagged_sd35
          - random
        concept_imputation:
          example: unstriped_zebra.png
          folder: zebra_unstriped
      - true_label: chequered
        generated:
          - chequered_flux
          - chequered_sd35
          - chequered_cgpt
          - random
        concept_imputation:
          example: unstriped_zebra.png
          folder: zebra_unstriped


models:
  - name: ResNet50V2
    graph_path_filename: ResNet50V2-architecture-and-weights-compiled.h5
    label_path_filename: ResNet50V2-imagenet-classes.txt
    preprocessing_function: tensorflow.keras.applications.resnet_v2.preprocess_input
    max_examples: 500
    layers:
      - "conv4_block3_out"
      - "conv4_block4_out"
      - "conv4_block5_out"
      - "conv4_block6_out"
      - "conv5_block1_out"
      - "conv5_block2_out"
      - "conv5_block3_out"
  - name: VGG16
    graph_path_filename: VGG16-architecture-and-weights-compiled.h5
    label_path_filename: VGG16-imagenet-classes.txt
    preprocessing_function: tensorflow.keras.applications.vgg16.preprocess_input
    max_examples: 500
    layers:
      - "block3_conv3"
      - "block4_conv1"
      - "block4_conv2"
      - "block4_conv3"
      - "block5_conv1"
      - "block5_conv2"
      - "block5_conv3"
  - name: InceptionV3
    graph_path_filename: InceptionV3-architecture-and-weights-compiled.h5
    label_path_filename: InceptionV3-imagenet-classes.txt
    preprocessing_function: tensorflow.keras.applications.inception_v3.preprocess_input
    max_examples: 500
    layers:
      - "mixed4"
      - "mixed5"
      - "mixed6"
      - "mixed7"
      - "mixed8"
      - "mixed10"
  - name: ConvNeXt
    graph_path_filename: ConvNeXt-architecture-and-weights-compiled
    label_path_filename: ConvNeXt-imagenet-classes.txt
    preprocessing_function: tensorflow.keras.applications.convnext.preprocess_input
    max_examples: 500
    layers:
      - 'tf.__operators__.add_32'
      - 'tf.__operators__.add_33'
      - 'tf.__operators__.add_34'
      - 'tf.__operators__.add_35'